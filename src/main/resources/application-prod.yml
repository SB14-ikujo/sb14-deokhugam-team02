# 운영(AWS) 전용 설정. SPRING_PROFILES_ACTIVE=prod 일 때 application.yml 위에 덮어쓴다.
# DB 접속 정보(SPRING_DATASOURCE_*)는 ECS Task Definition의 environment/secrets로 주입한다. 여기에 적지 않는다.
spring:
  datasource:        # 기본값 없음: 환경변수가 빠지면 localhost로 새지 않고 기동 시 바로 실패한다
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update   # TODO: 스키마 안정화 후 validate로 변경 (create는 재시작 때마다 테이블 삭제)
  docker:
    compose:
      enabled: false     # 운영에는 compose가 없다

logging:
  level:
    root: info
    com.sprint.deokhugam: info
    org.hibernate.SQL: info

deokhugam:
  storage:
    type: s3
    s3:
      access-key: ${AWS_S3_ACCESS_KEY:}   # TODO: Task Role 방식으로 바꾸면 access-key/secret-key 제거
      secret-key: ${AWS_S3_SECRET_KEY:}
      region: ${AWS_S3_REGION}
      bucket: ${AWS_S3_BUCKET}
      presigned-url-expiration: ${AWS_S3_PRESIGNED_URL_EXPIRATION:600} # (기본값: 10분)
