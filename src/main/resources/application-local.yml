spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/deokhugam}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:deokhugam}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD}}
  jpa:
    defer-datasource-initialization: true
    open-in-view: false
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: ALWAYS
  docker:
    compose:
      file: docker-compose-logging-pipeline.yml   # 기본 이름(compose.yaml)이 아니라서 지정
      lifecycle-management: start-only           # 앱 꺼져도 DB는 유지
      skip:
        in-tests: false

logging:
  file:
    path: ${LOG_PATH:logs}
  level:
    root: info
    com.sprint.deokhugam: debug
    org.hibernate.orm.jdbc.bind: trace
    org.hibernate.SQL: debug

