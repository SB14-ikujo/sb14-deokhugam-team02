spring:
  profiles:
    default: local
  application:
    name: deokhugam
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/deokhugam}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:deokhugam}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
  docker:
    compose:
      file: docker-compose-logging-pipeline.yml   # 기본 이름(compose.yaml)이 아니라서 지정
      lifecycle-management: start-only           # 앱 꺼져도 DB는 유지
      skip:
        in-tests: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  file:
    path: ${LOG_PATH:logs}
  level:
    root: info
    com.sprint.deokhugam: debug
    org.hibernate.SQL: debug

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: method

deokhugam:
  storage:
    type: ${STORAGE_TYPE:local}
    s3:
      access-key: ${AWS_S3_ACCESS_KEY:}
      secret-key: ${AWS_S3_SECRET_KEY:}
      region: ${AWS_S3_REGION:}
      bucket: ${AWS_S3_BUCKET:}
      presigned-url-expiration: ${AWS_S3_PRESIGNED_URL_EXPIRATION:600} # (기본값: 10분)

