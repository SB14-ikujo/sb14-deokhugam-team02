spring:
  profiles:
    default: local
  application:
    name: deokhugam
  config:
    import: optional:file:.env.${spring.profiles.active:local}[.properties]
  jpa:
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  batch:
    jdbc:
      initialize-schema: always   # 실행 기록 테이블(BATCH_*)을 자동 생성
    job:
      enabled: false              # 앱 켤 때 Job 자동 실행 끄기

logging:
  file:
    path: ${LOG_PATH:logs}
  level:
    root: info

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health, metrics   # 이 두 개만 열기, Spring Batch 관련

deokhugam:
  storage:
    type: ${STORAGE_TYPE:local}
    path: ${STORAGE_PATH:./uploads}
  ocr:
    api-key: ${OCR_SPACE_API_KEY:}
    url: https://api.ocr.space/parse/image

kakao:
  book:
    base-url: https://dapi.kakao.com
    rest-api-key: ${KAKAO_REST_API_KEY:}
