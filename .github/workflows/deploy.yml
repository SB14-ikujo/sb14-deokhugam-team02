name: CD

on:
  push:
    branches: [ main, chore/infra-setup ]

env:
  ECS_CLUSTER: deokhugam-cluster
  ECS_SERVICE: deokhugam-app-service
  ECS_TASK_FAMILY: deokhugam-app
  ECS_CONTAINER: deokhugam-app

jobs:
  build:
    name: 이미지 빌드 및 ECR 푸시
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image: ${{ steps.build-image.outputs.image }}
    steps:
      - name: 소스코드 가져오기
        uses: actions/checkout@v5

      - name: OIDC 임시 발급증 받기
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }} # gitactions-role
          aws-region: ${{ vars.AWS_REGION }}

      - name: 인증 확인 (누구로 로그인됐는지)
        run: aws sts get-caller-identity

      - name: ECR 로그인
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public
        env:
          AWS_REGION: us-east-1                # 이 스텝에서만 us-east-1 (공개 래포라서 비공개로 한다면 이 부분 다시 확인 필요)
          AWS_DEFAULT_REGION: us-east-1

      - name: 이미지 주소 확인
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          echo "registry   = $REGISTRY"
          echo "repository = $REPOSITORY"
          echo "image      = $REGISTRY/$REPOSITORY:${{ github.sha }}"

      - name: 이미지 빌드 및 ECR 푸시
        id: build-image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "🐳 도커 이미지 빌드 시작"
          docker build -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" .

          echo "✅ 도커 이미지 빌드 완료"

          echo "🚀 ECR 이미지 업로드 시작"
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          echo "image=$REGISTRY/$REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "🎉 ECR 이미지 업로드 완료"

  deploy:
    name: ECS 배포
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      # job 마다 별도 러너라서 AWS 로그인을 다시 한다.
      - name: OIDC 임시 발급증 받기
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }} # gitactions-role
          aws-region: ${{ vars.AWS_REGION }}

      # ECS에 등록된 최신 태스크 정의를 가져온다. 환경변수/시크릿 설정은 ECS 쪽이 기준이다.
      - name: 현재 태스크 정의 가져오기
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition > task-definition.json

      - name: 태스크 정의의 이미지 교체
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.ECS_CONTAINER }}
          image: ${{ needs.build.outputs.image }}

      - name: ECS 서비스 배포
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
