name: CD

on:
  push:
    branches: [ main ]

# main에 연속으로 푸시해도 배포가 겹치지 않고 하나씩 차례로 실행된다.
# cancel-in-progress: false → 진행 중인 배포를 취소하지 않고 기다린다 (배포 도중 취소되면 ECS가 어중간한 상태로 남을 수 있다)
concurrency:
  group: cd-main
  cancel-in-progress: false

env:
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }} # gitactions-role
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_APP_SERVICE: ${{ vars.ECS_APP_SERVICE }}
  ECS_APP_TASK_FAMILY: ${{ vars.ECS_APP_TASK_FAMILY }}
  ECS_CONTAINER: ${{ vars.ECS_CONTAINER }}

jobs:
  build:
    name: 이미지 빌드 및 ECR 푸시
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image: ${{ steps.build-image.outputs.image }}
    steps:
      - name: 소스코드 가져오기
        uses: actions/checkout@v5

      - name: OIDC 임시 발급증 받기
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public
        env:
          AWS_REGION: us-east-1                # 이 스텝에서만 us-east-1 (공개 래포라서 비공개로 한다면 이 부분 다시 확인 필요)
          AWS_DEFAULT_REGION: us-east-1

      - name: 이미지 주소 확인
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          echo "registry   = $REGISTRY"
          echo "repository = $REPOSITORY"
          echo "image      = $REGISTRY/$REPOSITORY:${{ github.sha }}"

      - name: 이미지 빌드 및 ECR 푸시
        id: build-image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "🐳 도커 이미지 빌드 시작"
          docker build -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" .

          echo "✅ 도커 이미지 빌드 완료"

          echo "🚀 ECR 이미지 업로드 시작"
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          echo "image=$REGISTRY/$REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "🎉 ECR 이미지 업로드 완료"

  deploy:
    name: ECS 배포
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      # job 마다 별도 러너라서 AWS 로그인을 다시 한다.
      - name: OIDC 임시 발급증 받기
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ECS에 등록된 최신 태스크 정의를 가져온다. 환경변수/시크릿 설정은 ECS 쪽이 기준이다.
      - name: 현재 태스크 정의 가져오기
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_APP_TASK_FAMILY" \
            --query taskDefinition > task-definition.json

      - name: 태스크 정의의 이미지 교체
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.ECS_CONTAINER }}
          image: ${{ needs.build.outputs.image }}

      - name: ECS 서비스 배포
        id: deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_APP_SERVICE }}
          wait-for-service-stability: true
          # 기본 대기가 30분이라 기동 실패 시 워크플로우가 오래 붙잡힌다. 10분 안에 안정화되지 않으면 실패 처리한다
          wait-for-minutes: 10

      # 배포가 실패하면 마지막에 원인을 모아서 Actions 요약 화면(Summary)에 남긴다.
      # 원인 조회 자체가 실패해도(권한 부족 등) 원래 실패 원인을 가리지 않도록 각 조회는 || true 로 넘어간다.
      # 필요 권한: ecs:DescribeServices, ecs:ListTasks, ecs:DescribeTasks
      - name: 배포 실패 원인 정리
        if: failure()
        run: |
          {
            echo "## ❌ 배포 실패 원인"
            echo
            echo "- 🚨 실패한 단계: \`ECS 서비스 배포\` 결과 = \`${{ steps.deploy.outcome }}\`"
            echo "- 🧩 서비스: \`$ECS_APP_SERVICE\` / 🗂️ 클러스터: \`$ECS_CLUSTER\`"
            echo "- 🐳 이미지: \`${{ needs.build.outputs.image }}\`"
            echo
            echo "### 📜 ECS 서비스 최근 이벤트 (최신순 10개)"
            echo '```'
            aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_APP_SERVICE" \
              --query 'services[0].events[:10].[createdAt,message]' --output text \
              || echo "⚠️ (서비스 이벤트 조회 실패: 역할에 ecs:DescribeServices 권한이 있는지 확인)"
            echo '```'
            echo
            echo "### 🛑 최근 중지된 태스크의 중지 사유 (최대 5개)"
            echo '```'
            TASKS=$(aws ecs list-tasks --cluster "$ECS_CLUSTER" --service-name "$ECS_APP_SERVICE" \
              --desired-status STOPPED --query 'taskArns[:5]' --output text || true)
            if [ -n "$TASKS" ] && [ "$TASKS" != "None" ]; then
              aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks $TASKS \
                --query 'tasks[].[stoppedAt,stoppedReason,containers[0].reason,containers[0].exitCode]' --output text \
                || echo "⚠️ (태스크 조회 실패: 역할에 ecs:DescribeTasks 권한이 있는지 확인)"
            else
              echo "ℹ️ 중지된 태스크 없음 (또는 조회 권한 없음)"
            fi
            echo '```'
            echo
            echo "> 🔎 컨테이너 기동 오류(환경변수 누락, DB 접속 실패 등)는 CloudWatch Logs의 해당 태스크 로그에서 확인"
          } | tee -a "$GITHUB_STEP_SUMMARY"
