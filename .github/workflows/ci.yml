name: CI

on:
  pull_request:
    branches: [ develop, main ]
  push:
    branches: [ develop ]              # 머지 후 재검증 + 캐시 저장용
  # ⚠️ paths-ignore 절대 금지: 필수 체크가 "대기 중"으로 남아 머지가 영원히 막힘

permissions:
  contents: read       # 코드 체크아웃용
  pull-requests: write # PR 코멘트 작성용

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # PR만 이전 빌드 취소, develop 머지 빌드는 취소 안 함

jobs:
  build:
    name: build                      # Ruleset 필수 체크에 이 이름으로 등록
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: ci-dummy-password   # compose의 필수값 검사를 통과시키는 CI 전용 가짜 값 (진짜 비밀 아님)
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6  # 캐시 + wrapper 바꿔치기 검사
        with:
          cache-provider: basic               # 오픈소스(MIT) 캐시
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}   # develop에서만 캐시 저장

      - name: gradlew 실행 권한 (방어용)
        run: chmod +x gradlew

      # 기본 .env는 없어도 compose가 넘어가지만, 명시한 .env.local은 없으면 에러라서 CI용 가짜 파일을 생성한다.
      - name: CI용 .env.local 생성
        run: echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" > .env.local

      - name: 빌드 + 테스트
        run: ./gradlew build              # 테스트 중 Spring이 compose로 postgres를 자동 기동

      - name: Codecov 업로드
        uses: codecov/codecov-action@v5
        continue-on-error: true           # 업로드가 실패해도 이후 step과 CI 결과에 영향 없음
        with:
          files: ./build/reports/jacoco/test/jacocoTestReport.xml
          fail_ci_if_error: false         # Codecov 장애로 CI가 깨지지 않게 (안정화 후 true로)
          flags: unittests
          name: deokhugam
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: 커버리지 PR 코멘트 추가
        id: jacoco                        # 이 step의 출력값을 뒤 step에서 쓰기 위한 이름표
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@e51ce1f46f7f8b5331593f935e59cbaf44b84920  # jacoco 결과를 추가해주는 라이브러리(v1.8.0 )
        with:
          paths: ${{ github.workspace }}/build/reports/jacoco/test/jacocoTestReport.xml # 테스트 결과 파일 경로
          token: ${{ secrets.GITHUB_TOKEN }}   # 개인 토큰 자동 사용
          min-coverage-changed-files: 80       # 변경 파일 기준 최소 테스트커버리지
          title: 테스트 커버리지 측정
          update-comment: true

      #      - name: 변경 파일 커버리지 80% 검사
      #        if: github.event_name == 'pull_request' && steps.jacoco.outputs.coverage-changed-files < 80
      #        run: |
      #          echo "변경 파일 커버리지: ${{ steps.jacoco.outputs.coverage-changed-files }}%"
      #          exit 1

      - name: 실패 시 postgres 로그
        if: failure()
        run: docker compose -f docker-compose-logging-pipeline.yml logs postgres || true


      - name: 실패 시 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/reports/checkstyle/
            build/jacocoHtml/
          retention-days: 7
          if-no-files-found: ignore
